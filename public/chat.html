<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>YuYanTV Chat — apipro dev page</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; background: #f4f5f7; color: #222; }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .panel { background: #fff; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 12px; }
    .panel h2 { font-size: 14px; margin: 0 0 8px; color: #888; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
    input, button { font: inherit; padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
    input:focus { border-color: #4a90e2; }
    button { background: #4a90e2; color: #fff; border: none; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .row label { min-width: 70px; color: #666; }
    .row input { flex: 1; min-width: 120px; }
    .status { font-size: 12px; padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .status.online { background: #d4edda; color: #155724; }
    .status.offline { background: #f8d7da; color: #721c24; }
    .status.connecting { background: #fff3cd; color: #856404; }
    .messages { max-height: 320px; overflow-y: auto; padding: 4px 0; }
    .msg { padding: 4px 0; border-bottom: 1px solid #f0f0f0; word-break: break-word; }
    .msg .nick { color: #4a90e2; font-weight: 500; }
    .msg .time { color: #999; font-size: 11px; margin-left: 8px; }
    .msg.system { color: #888; font-style: italic; }
    .views { color: #e23; font-weight: 600; }
    .log { font-family: monospace; font-size: 11px; color: #888; max-height: 100px; overflow-y: auto; padding: 4px 8px; background: #fafafa; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>YuYanTV Chat — apipro dev page</h1>

    <div class="panel">
      <h2>Auth</h2>
      <div class="row">
        <label>Phone</label>
        <input id="phone" value="13800138888" />
      </div>
      <div class="row">
        <label>Password</label>
        <input id="password" value="qwe123" type="password" />
      </div>
      <div class="row">
        <label>Plat</label>
        <select id="plat">
          <option value="1">android</option>
          <option value="2">ios</option>
          <option value="3">pc</option>
          <option value="4" selected>h5</option>
        </select>
        <button id="loginBtn">Login (encrypted)</button>
        <button id="guestBtn">Guest login</button>
      </div>
      <div class="row">
        <label>Token</label>
        <input id="token" placeholder="(auto-filled after login)" readonly />
      </div>
    </div>

    <div class="panel">
      <h2>Room</h2>
      <div class="row">
        <label>Room #</label>
        <input id="roomNum" value="1001" />
        <button id="enterBtn" disabled>Enter room</button>
      </div>
      <div>Status: <span id="status" class="status offline">offline</span> |
              Viewers: <span id="viewers" class="views">0</span></div>
    </div>

    <div class="panel">
      <h2>Chat</h2>
      <div class="messages" id="messages"></div>
      <div class="row">
        <input id="msg" placeholder="type a message..." />
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>

    <div class="panel">
      <h2>Log</h2>
      <div class="log" id="log"></div>
    </div>
  </div>

<script>
// =============================================================
// YuYanTV chat client — binary frame protocol
//
// Frame format (BINARY):
//   [0x00][0xA0][opcode uint16 BE][len uint32 BE][AES-128-ECB-PKCS7(JSON body)]
//
// We use the WebCrypto API for AES-128-ECB (PKCS7 padding). Note: Chrome still
// supports ECB despite the spec deprecation; Firefox/Safari work too.
//
// Opcodes (subset):
//   1001 LOGIN  { key, plat, version }
//   1003 ROOM_ENTER { roomNum, haveHistory }
//   1005 COMMENT { roomNum, content }
//   2001 LOGIN_ACK
//   2003 ROOM_ENTER_ACK
//   2005 COMMENT_ACK
//   3000 COMMENT_PUSH { sendUser, content, sendTime, msgType }
//   3005 VIEW_NUM_PUSH { roomNum, viewNum }
//   9999 ERROR { errCode, errMsg }
// =============================================================

const API_BASE = location.origin;
const REQ_KEY_BYTES = new TextEncoder().encode("PHp1st5vEg5Ca8FH");
const RESP_KEY_BYTES = new TextEncoder().encode("qlCJekfRKwWkQxl7");

let ws = null;
let cryptoKey = null; // CryptoKey for response decryption
let reqCryptoKey = null; // CryptoKey for request encryption
let currentRoom = null;

// ---- AES-128-ECB/PKCS7 helpers (WebCrypto) ----

async function importKeys() {
  // AES-ECB is no longer in the WebCrypto spec but Chrome + Firefox still
  // accept it for AES-128. If unavailable, fall back to JSON text mode.
  try {
    cryptoKey = await crypto.subtle.importKey(
      "raw", RESP_KEY_BYTES, { name: "AES-ECB" }, false, ["decrypt"]
    );
    reqCryptoKey = await crypto.subtle.importKey(
      "raw", REQ_KEY_BYTES, { name: "AES-ECB" }, false, ["encrypt"]
    );
    return true;
  } catch (e) {
    log("AES-ECB unavailable; falling back to JSON text mode");
    return false;
  }
}

function pkcs7Pad(buf) {
  const pad = 16 - (buf.byteLength % 16);
  const out = new Uint8Array(buf.byteLength + pad);
  out.set(new Uint8Array(buf), 0);
  for (let i = buf.byteLength; i < out.byteLength; i++) out[i] = pad;
  return out;
}

function pkcs7Unpad(buf) {
  if (buf.byteLength === 0) return buf;
  const view = new Uint8Array(buf);
  const pad = view[view.byteLength - 1];
  if (pad < 1 || pad > 16 || pad > view.byteLength) return buf;
  return buf.slice(0, view.byteLength - pad);
}

async function encryptBody(jsonStr) {
  if (!reqCryptoKey) return null;
  const data = new TextEncoder().encode(jsonStr);
  const padded = pkcs7Pad(data);
  const ct = await crypto.subtle.encrypt({ name: "AES-ECB" }, reqCryptoKey, padded);
  return new Uint8Array(ct);
}

async function decryptBody(ctBytes) {
  if (!cryptoKey) return null;
  const pt = await crypto.subtle.decrypt({ name: "AES-ECB" }, cryptoKey, ctBytes);
  return pkcs7Unpad(pt);
}

// ---- Frame encoding ----

function encodeFrame(op, bodyBytes) {
  const len = bodyBytes ? bodyBytes.byteLength : 0;
  const out = new Uint8Array(8 + len);
  out[0] = 0x00; out[1] = 0xA0;
  out[2] = (op >> 8) & 0xff;
  out[3] = op & 0xff;
  const dv = new DataView(out.buffer);
  dv.setUint32(4, len);
  if (len > 0) out.set(bodyBytes, 8);
  return out;
}

function parseFrame(buf) {
  if (buf.byteLength < 8) return null;
  const view = new Uint8Array(buf);
  if (view[0] !== 0x00 || view[1] !== 0xA0) return null;
  const op = (view[2] << 8) | view[3];
  const dv = new DataView(view.buffer);
  const len = dv.getUint32(4);
  const body = view.slice(8, 8 + len);
  return { op, body };
}

// ---- UI helpers ----

function log(msg) {
  const el = document.getElementById("log");
  const ts = new Date().toLocaleTimeString();
  el.innerHTML = `[${ts}] ${msg}<br>` + el.innerHTML;
}

function setStatus(text, cls) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status " + cls;
}

function addMessage(obj) {
  const el = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg" + (obj.msgType === 3 || obj.system ? " system" : "");
  const nick = obj.sendUser?.nickName || obj.nick || "system";
  const text = obj.content || obj.text || JSON.stringify(obj);
  const t = obj.sendTime ? new Date(obj.sendTime).toLocaleTimeString() : "";
  div.innerHTML = `<span class="nick">${escapeHtml(nick)}:</span> ${escapeHtml(text)}${t ? `<span class="time">${t}</span>` : ""}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&#34;","'":"&#39;" }[c]));
}

// ---- Encrypted HTTP login ----

async function md5Hex(str) {
  // MD5 implementation (compact, public-domain).
  // Returns lowercase hex.
  function r(n,c){return (n+c).toString(16).slice(-1);}
  function ad(x,y){const l=(x&0xFFFF)+(y&0xFFFF);const m=(x>>16)+(y>>16)+(l>>16);return (m<<16)|(l&0xFFFF);}
  function rl(x,c){return (x<<c)|(x>>>(32-c));}
  function cm(q,a,b,x,s,t){return ad(rl(ad(ad(a,q),ad(x,t)),s),b);}
  function ff(a,b,c,d,x,s,t){return cm((b&c)|((~b)&d),a,b,x,s,t);}
  function gg(a,b,c,d,x,s,t){return cm((b&d)|(c&(~d)),a,b,x,s,t);}
  function hh(a,b,c,d,x,s,t){return cm(b^c^d,a,b,x,s,t);}
  function ii(a,b,c,d,x,s,t){return cm(c^(b|(~d)),a,b,x,s,t);}
  function cv(s){
    const u = unescape(encodeURIComponent(s));
    const n = ((u.length+8)>>6)+1;
    const b = new Array(n*16).fill(0);
    for (let i=0;i<u.length;i++) b[i>>2] |= u.charCodeAt(i)<<((i%4)*8);
    b[u.length>>2] |= 0x80<<((u.length%4)*8);
    b[n*16-2] = u.length<<3;
    return b;
  }
  const x = cv(str);
  let a=1732584193,b=-271733879,c=-1732584194,d=271733878;
  for (let i=0;i<x.length;i+=16){
    const oa=a,ob=b,oc=c,od=d;
    a=ff(a,b,c,d,x[i],7,-680876936); d=ff(d,a,b,c,x[i+1],12,-389564586);
    c=ff(c,d,a,b,x[i+2],17,606105819); b=ff(b,c,d,a,x[i+3],22,-1044525330);
    a=ff(a,b,c,d,x[i+4],7,-176418897); d=ff(d,a,b,c,x[i+5],12,1200080426);
    c=ff(c,d,a,b,x[i+6],17,-1473231341); b=ff(b,c,d,a,x[i+7],22,-45705983);
    a=ff(a,b,c,d,x[i+8],7,1770035416); d=ff(d,a,b,c,x[i+9],12,-1958414417);
    c=ff(c,d,a,b,x[i+10],17,-42063); b=ff(b,c,d,a,x[i+11],22,-1990404162);
    a=ff(a,b,c,d,x[i+12],7,1804603682); d=ff(d,a,b,c,x[i+13],12,-40341101);
    c=ff(c,d,a,b,x[i+14],17,-1502002290); b=ff(b,c,d,a,x[i+15],22,1236535329);
    a=gg(a,b,c,d,x[i+1],5,-165796510); d=gg(d,a,b,c,x[i+6],9,-1069501632);
    c=gg(c,d,a,b,x[i+11],14,643717713); b=gg(b,c,d,a,x[i],20,-373897302);
    a=gg(a,b,c,d,x[i+5],5,-701558691); d=gg(d,a,b,c,x[i+10],9,38016083);
    c=gg(c,d,a,b,x[i+15],14,-660478335); b=gg(b,c,d,a,x[i+4],20,-405537848);
    a=gg(a,b,c,d,x[i+9],5,568446438); d=gg(d,a,b,c,x[i+14],9,-1019803690);
    c=gg(c,d,a,b,x[i+3],14,-187363961); b=gg(b,c,d,a,x[i+8],20,1163531501);
    a=gg(a,b,c,d,x[i+13],5,-1444681467); d=gg(d,a,b,c,x[i+2],9,-51403784);
    c=gg(c,d,a,b,x[i+7],14,1735328473); b=gg(b,c,d,a,x[i+12],20,-1926607734);
    a=hh(a,b,c,d,x[i+5],4,-378558); d=hh(d,a,b,c,x[i+8],11,-2022574463);
    c=hh(c,d,a,b,x[i+11],16,1839030562); b=hh(b,c,d,a,x[i+14],23,-35309556);
    a=hh(a,b,c,d,x[i+1],4,-1530992060); d=hh(d,a,b,c,x[i+4],11,1272893353);
    c=hh(c,d,a,b,x[i+7],16,-155497632); b=hh(b,c,d,a,x[i+10],23,-1094730640);
    a=hh(a,b,c,d,x[i+13],4,681279174); d=hh(d,a,b,c,x[i],11,-358537222);
    c=hh(c,d,a,b,x[i+3],16,-722521979); b=hh(b,c,d,a,x[i+6],23,76029189);
    a=hh(a,b,c,d,x[i+9],4,-640364487); d=hh(d,a,b,c,x[i+12],11,-421815835);
    c=hh(c,d,a,b,x[i+15],16,530742520); b=hh(b,c,d,a,x[i+2],23,-995338651);
    a=ii(a,b,c,d,x[i],6,-198630844); d=ii(d,a,b,c,x[i+7],10,1126891415);
    c=ii(c,d,a,b,x[i+14],15,-1416354905); b=ii(b,c,d,a,x[i+5],21,-57434055);
    a=ii(a,b,c,d,x[i+12],6,1700485571); d=ii(d,a,b,c,x[i+3],10,-1894986606);
    c=ii(c,d,a,b,x[i+10],15,-1051523); b=ii(b,c,d,a,x[i+1],21,-2054922799);
    a=ii(a,b,c,d,x[i+8],6,1873313359); d=ii(d,a,b,c,x[i+15],10,-30611744);
    c=ii(c,d,a,b,x[i+6],15,-1560198380); b=ii(b,c,d,a,x[i+13],21,1309151649);
    a=ii(a,b,c,d,x[i+4],6,-145523070); d=ii(d,a,b,c,x[i+11],10,-1120210379);
    c=ii(c,d,a,b,x[i+2],15,718787259); b=ii(b,c,d,a,x[i+9],21,-343485551);
    a=ad(a,oa); b=ad(b,ob); c=ad(c,oc); d=ad(d,od);
  }
  return [a,b,c,d].map(n => {
    const s = "0" + (n<0?n+4294967296:n).toString(16);
    return s.substr(s.length-8);
  }).join("");
}

async function httpLogin(endpoint, param) {
  // Encrypt param JSON with req key (AES-128-ECB/PKCS7 + frame header).
  if (!reqCryptoKey) { await importKeys(); }
  const json = JSON.stringify(param);
  let body;
  if (reqCryptoKey) {
    const ct = await encryptBody(json);
    body = encodeFrame(0, ct).buffer; // op=0 placeholder (server doesn't care)
  } else {
    body = json; // fallback: plaintext JSON (server also accepts)
  }
  const resp = await fetch(API_BASE + endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Session": "" },
    body,
  });
  const buf = await resp.arrayBuffer();
  // Try framed binary first; if magic mismatch, treat as plaintext.
  const view = new Uint8Array(buf);
  let jsonStr;
  if (view.length >= 6 && view[0] === 0x00 && view[1] === 0xA0) {
    const len = new DataView(buf).getUint32(2);
    const ct = view.slice(6, 6 + len);
    if (cryptoKey) {
      const pt = await decryptBody(ct);
      jsonStr = new TextDecoder().decode(pt);
    } else {
      jsonStr = "";
    }
  } else {
    jsonStr = new TextDecoder().decode(view);
  }
  try { return JSON.parse(jsonStr); }
  catch (e) { log("login parse error: " + e); return null; }
}

// ---- WebSocket ----

async function connectWS() {
  if (ws) { ws.close(); ws = null; }
  await importKeys();
  setStatus("connecting", "connecting");
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/chat`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    setStatus("online (unauth)", "online");
    log("WS connected; sending LOGIN(1001)");
    sendLogin();
  };
  ws.onmessage = async (ev) => {
    if (typeof ev.data === "string") {
      // Legacy JSON text mode
      try {
        const obj = JSON.parse(ev.data);
        handleServerMessage(0, obj);
      } catch (e) {}
      return;
    }
    const buf = ev.data;
    const f = parseFrame(buf);
    if (!f) return;
    let obj = {};
    if (f.body.byteLength > 0) {
      try {
        let jsonStr;
        if (cryptoKey) {
          const pt = await decryptBody(f.body);
          jsonStr = new TextDecoder().decode(pt);
        } else {
          jsonStr = new TextDecoder().decode(f.body);
        }
        obj = JSON.parse(jsonStr);
      } catch (e) {
        log("decrypt/parse error: " + e);
        return;
      }
    }
    handleServerMessage(f.op, obj);
  };
  ws.onclose = () => {
    setStatus("offline", "offline");
    log("WS closed");
    ws = null;
    document.getElementById("enterBtn").disabled = true;
    document.getElementById("sendBtn").disabled = true;
  };
  ws.onerror = (e) => log("WS error: " + JSON.stringify(e));
}

async function sendFrame(op, bodyObj) {
  if (!ws || ws.readyState !== 1) return;
  const json = bodyObj ? JSON.stringify(bodyObj) : "";
  let bodyBytes = null;
  if (json) {
    bodyBytes = reqCryptoKey ? await encryptBody(json) : new TextEncoder().encode(json);
  }
  const frame = encodeFrame(op, bodyBytes);
  ws.send(frame);
}

function sendLogin() {
  const token = document.getElementById("token").value.trim();
  const plat = parseInt(document.getElementById("plat").value, 10) || 4;
  if (!token) { log("no token — skip login"); return; }
  sendFrame(1001, { key: token, plat, version: 1 });
}

function sendRoomEnter() {
  const room = document.getElementById("roomNum").value.trim();
  if (!room) return;
  currentRoom = room;
  sendFrame(1003, { roomNum: room, haveHistory: 1 });
}

function sendComment() {
  const msg = document.getElementById("msg").value.trim();
  if (!msg || !currentRoom) return;
  sendFrame(1005, { roomNum: currentRoom, msgType: 1, content: msg });
  document.getElementById("msg").value = "";
}

function handleServerMessage(op, obj) {
  switch (op) {
    case 2001: // LOGIN_SUCCESS
      log("LOGIN_ACK");
      document.getElementById("enterBtn").disabled = false;
      break;
    case 2003: // ROOM_ENTER_SUCCESS
      log("ROOM_ENTER_ACK");
      document.getElementById("sendBtn").disabled = false;
      break;
    case 2005: // COMMENT_SUCCESS
      // local echo not needed — server will broadcast
      break;
    case 3000: // COMMENT_PUSH
      addMessage(obj);
      break;
    case 3005: // VIEW_NUM_PUSH
      document.getElementById("viewers").textContent = obj.viewNum ?? 0;
      break;
    case 9999: // ERROR
      log(`ERROR ${obj.errCode}: ${obj.errMsg}`);
      break;
    default:
      log(`op=${op}: ${JSON.stringify(obj)}`);
  }
}

// ---- UI wiring ----

document.getElementById("loginBtn").addEventListener("click", async () => {
  const phone = document.getElementById("phone").value.trim();
  const pw = document.getElementById("password").value;
  const plat = parseInt(document.getElementById("plat").value, 10) || 4;
  if (!phone || !pw) return;
  const clientMd5 = await md5Hex(pw);
  log(`login: phone=${phone} clientMd5=${clientMd5}`);
  const resp = await httpLogin("/login/login", {
    accountType: 1, countryCode: "+86", phone,
    loginMode: 1, loginType: 1, password: clientMd5, pwdType: 2, plat,
  });
  if (!resp) return;
  log(`login resp code=${resp.code} meg=${resp.meg}`);
  if (resp.code === 200 && resp.result) {
    const data = typeof resp.result === "string" ? JSON.parse(resp.result) : resp.result;
    document.getElementById("token").value = data.accessToken || "";
    log(`got accessToken (len=${(data.accessToken||"").length})`);
  }
});

document.getElementById("guestBtn").addEventListener("click", async () => {
  const plat = parseInt(document.getElementById("plat").value, 10) || 4;
  const resp = await httpLogin("/login/guestLogin", { plat });
  log(`guest resp code=${resp?.code}`);
  if (resp?.code === 200 && resp.result) {
    const data = typeof resp.result === "string" ? JSON.parse(resp.result) : resp.result;
    document.getElementById("token").value = data.accessToken || "";
    log(`got guest accessToken`);
  }
});

document.getElementById("enterBtn").addEventListener("click", () => {
  if (!ws) connectWS().then(sendRoomEnter);
  else sendRoomEnter();
});

document.getElementById("sendBtn").addEventListener("click", sendComment);
document.getElementById("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendComment();
});

// Auto-connect WS when a token is pasted.
document.getElementById("token").addEventListener("change", () => {
  if (!ws && document.getElementById("token").value.trim()) {
    connectWS();
  }
});

log("page loaded — click Login to start");
</script>
</body>
</html>
