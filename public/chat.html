<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>直播间聊天</title>
<style>
  :root{
    --bg:#0f1320; --panel:#171c2e; --bubble:#222a44; --me:#2f6df6;
    --text:#e7ecf5; --muted:#8b93a7; --accent:#ffb020; --danger:#ff5d5d;
    --sys:#3a4257;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; height:100vh;
  }
  .chat-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid #232a40}
  .chat-head .dot{width:8px;height:8px;border-radius:50%;background:#ff4d4f;box-shadow:0 0 6px #ff4d4f}
  .chat-head .title{font-weight:600;flex:1}
  .chat-head .count{color:var(--muted);font-size:12px}
  .msg-list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .msg-list::-webkit-scrollbar{width:6px}
  .msg-list::-webkit-scrollbar-thumb{background:#2a3457;border-radius:3px}
  .msg{display:flex;gap:8px;align-items:flex-start}
  .msg .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3a4257,#2f6df6);flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
  .msg .body{flex:1;min-width:0}
  .msg .nick{font-size:12px;color:var(--accent);margin-bottom:2px}
  .msg.guest .nick{color:var(--muted)}
  .msg.me .nick{color:var(--me)}
  .msg .bubble{display:inline-block;background:var(--bubble);padding:6px 10px;border-radius:10px;max-width:100%;word-break:break-word;white-space:pre-wrap}
  .msg.me .bubble{background:var(--me);color:#fff}
  .msg.sys{justify-content:center}
  .msg.sys .bubble{background:transparent;color:var(--muted);font-size:12px}
  .msg.danmu .bubble{background:transparent;color:var(--accent)}
  .composer{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid #232a40}
  .composer input{flex:1;background:#0c1020;border:1px solid #2a3457;color:var(--text);border-radius:8px;padding:8px 12px;outline:none;font-size:14px}
  .composer input:focus{border-color:var(--me)}
  .composer button{background:var(--me);color:#fff;border:none;border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer}
  .composer button:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--danger);font-size:12px;padding:0 12px 4px}
  .danmu-toggle{font-size:12px;color:var(--muted);cursor:pointer;user-select:none;padding:2px 6px;border-radius:4px}
  .danmu-toggle.on{color:var(--accent);background:rgba(255,176,32,.12)}
</style>
</head>
<body>
  <div class="chat-head">
    <span class="dot"></span>
    <span class="title">直播间聊天</span>
    <span class="count" id="count">在线 0</span>
    <span class="danmu-toggle" id="danmuTg">弹幕关</span>
  </div>
  <div class="msg-list" id="list"></div>
  <div class="err" id="err"></div>
  <div class="composer">
    <input id="input" maxlength="500" placeholder="说点什么…  (Enter 发送)" autocomplete="off" />
    <button id="send">发送</button>
  </div>

<script>
(function(){
  // ---- config from URL ----
  var qs = new URLSearchParams(location.search);
  var TOKEN   = qs.get("token") || localStorage.getItem("apipro_token") || "";
  var ROOM    = qs.get("roomNum") || qs.get("room") || "1001";
  var WS_PATH = qs.get("wsPath") || "/ws/chat";
  var port = qs.get("XTransformPort");
  var proto = location.protocol === "https:" ? "wss:" : "ws:";
  var wsUrl = proto + "//" + location.host + WS_PATH + "?roomNum=" + encodeURIComponent(ROOM) + "&token=" + encodeURIComponent(TOKEN);
  if (port) wsUrl += "&XTransformPort=" + encodeURIComponent(port);

  var list = document.getElementById("list");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var errEl = document.getElementById("err");
  var danmuTg = document.getElementById("danmuTg");
  var showDanmu = false;

  danmuTg.addEventListener("click", function(){
    showDanmu = !showDanmu;
    danmuTg.textContent = showDanmu ? "弹幕开" : "弹幕关";
    danmuTg.classList.toggle("on", showDanmu);
    if(!showDanmu){
      var ds = list.querySelectorAll(".msg.danmu");
      ds.forEach(function(d){ d.style.display="none"; });
    }
  });

  function escapeHtml(s){ return s.replace(/[&<>"']/g, function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&#34;':'&#39;';
  });}

  function addMsg(m){
    if(m.msgType===1 && !showDanmu) return;
    var el = document.createElement("div");
    var cls = "msg";
    if(m.sendUid==="system") cls += " sys";
    if(m.msgType===1) cls += " danmu";
    if(m.sendUid===window.MY_UID) cls += " me";
    el.className = cls;
    if(m.sendUid==="system"){
      el.innerHTML = '<span class="bubble">'+escapeHtml(m.content)+'</span>';
    } else {
      var initial = (m.nickName||"?").charAt(0).toUpperCase();
      var nick = escapeHtml(m.nickName||"游客");
      var avatar = m.icon ? '<img src="'+escapeHtml(m.icon)+'" style="width:26px;height:26px;border-radius:50%"/>'
                          : '<div class="avatar">'+escapeHtml(initial)+'</div>';
      el.innerHTML = avatar +
        '<div class="body"><div class="nick">'+nick+(m.level?(' · Lv'+m.level):'')+'</div>'+
        '<div class="bubble">'+escapeHtml(m.content)+'</div></div>';
    }
    list.appendChild(el);
    while(list.children.length > 200) list.removeChild(list.firstChild);
    list.scrollTop = list.scrollHeight;
  }

  function setErr(msg){ if(!msg){ errEl.textContent=""; return;} errEl.textContent=msg; setTimeout(function(){ if(errEl.textContent===msg) errEl.textContent=""; },3000); }

  var ws = null;
  var reconnectDelay = 1000;
  function connect(){
    try{ ws = new WebSocket(wsUrl); }catch(e){ setErr("不支持WebSocket"); return; }
    ws.onopen = function(){ reconnectDelay = 1000; setErr(""); };
    ws.onmessage = function(ev){
      var m;
      try{ m = JSON.parse(ev.data); }catch(e){ return; }
      if(m.error){ setErr(m.error); return; }
      if(m.msgType===1 && !showDanmu) return;
      addMsg(m);
    };
    ws.onclose = function(){ setErr("连接断开，重连中…"); setTimeout(connect, reconnectDelay); if(reconnectDelay<10000) reconnectDelay*=2; };
    ws.onerror = function(){ setErr("连接错误"); };
  }

  function doSend(){
    var txt = input.value.trim();
    if(!txt) return;
    if(!ws || ws.readyState!==1){ setErr("未连接"); return; }
    ws.send(JSON.stringify({content:txt, msgType:3}));
    input.value="";
  }
  sendBtn.addEventListener("click", doSend);
  input.addEventListener("keydown", function(e){ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }});

  connect();
  window.addEventListener("beforeunload", function(){ try{ if(ws) ws.close(); }catch(e){} });
})();
</script>
</body>
</html>
