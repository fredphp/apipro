syntax = "proto3";

package apipro;

option go_package = "./apipro";

// Generic request/response envelope.
// All business methods are dispatched by `method` name; `param_json` carries
// the raw JSON of the business request payload. The gateway encrypts/decrypts
// the wire bytes — RPC traffic is plain JSON.

message CallReq {
  string method = 1;        // e.g. "login", "register", "matches_jsonp", "live_hot"
  string param_json = 2;    // JSON-encoded business params
  string session_id = 3;    // opaque access token (audience)
  string plat = 4;          // "android" | "ios" | "pc" | "h5"
  int32  seq = 5;           // client sequence id (echoed in resp)
}

message CallResp {
  int32  code = 1;          // 200 = OK; 100 = login_required; 101 = guest_reauth; 400 = business_error; 4xxx = auth errors
  string meg = 2;           // legacy misspelling of "msg" — preserved for client compat
  int32  seq = 3;           // echoed from req
  string new_session_id = 4;
  bytes  result = 5;        // raw JSON bytes of business response (the `data` object)
}

service Apipro {
  rpc Call(CallReq) returns (CallResp);
}
