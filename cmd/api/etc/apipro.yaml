Name: apipro
Host: 0.0.0.0
Port: 3100
AppMode: dev

# ============================================================
# RPC client → apipro-rpc on 127.0.0.1:3101
# ============================================================
ApiproRpc:
  Endpoints:
    - 127.0.0.1:3101
  NonBlock: true
  Timeout: 2000000000   # 2 seconds (nanoseconds)

# ============================================================
# Redis (sessions + rate limit + chat history + shared cache)
# ============================================================
Redis:
  Host: 127.0.0.1:6399
  Type: node

# ============================================================
# Database for WS chat persistence + room/user lookups
# (AUDIT-010/011/012). When DataSource is empty, the WS hub runs in
# Redis-only mode (no MySQL persistence, no live-status check).
#
# Production uses a multi-database MySQL layout (zb_user / zb_live / zb_chat
# / ...). The DSN must NOT pin a specific database — leave the path empty
# so cross-schema queries work:
#
#   user:pass@tcp(host:port)/?params...
#
# SchemaPrefix must match the RPC service so both processes emit the same
# fully-qualified table names.
# ============================================================
DBDriver: mysql
DataSource: root:123456@tcp(127.0.0.1:3306)/?charset=utf8mb4&parseTime=true&loc=Local&allowNativePasswords=true
# DBDriver: sqlite
# DataSource: ./data/apipro.db
SchemaPrefix: "zb_"

# ============================================================
# Transport encryption (must match RPC)
# ============================================================
ApiKeyReq: "PHp1st5vEg5Ca8FH"
ApiKeyResp: "qlCJekfRKwWkQxl7"

# ============================================================
# App mode + SMS dev bypass
# ============================================================
SmsDevBypassCode: "8888"

# ============================================================
# JSONP snapshot directory (served as static files)
# ============================================================
JsonpSnapshotDir: ./data/jsonp

# ============================================================
# File asset URL prefix
# ============================================================
FileBaseURL: "https://sta.ncctrials.com/file"

# ============================================================
# Rate limits
# ============================================================
RateLimitPerMinute: 120
RateLimitAuthPerMinute: 20

# ============================================================
# Chat
# ============================================================
ChatMaxMsgLen: 500
ChatHistoryLim: 50
ChatRatePerMin: 60

# ============================================================
# CORS
# ============================================================
CorsOrigin: "*"
