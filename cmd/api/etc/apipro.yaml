Name: apipro
Host: 0.0.0.0
Port: 3100
AppMode: dev

# ============================================================
# RPC client → apipro-rpc on 127.0.0.1:3101
# ============================================================
ApiproRpc:
  Endpoints:
    - 127.0.0.1:3101
  NonBlock: true
  Timeout: 2000000000   # 2 seconds (nanoseconds)

# ============================================================
# Redis (sessions + rate limit + chat history + shared cache)
# ============================================================
Redis:
  Host: 127.0.0.1:6379
  Type: node

# ============================================================
# Multi-Database Configuration (MySQL)
# ============================================================

DBDriver: mysql
DataSource: root:80DC24@2705e@tcp(54.251.241.85:3306)/?charset=utf8mb4&parseTime=true&loc=Local&allowNativePasswords=true
# DBDriver: sqlite
# DataSource: ./data/apipro.db
SchemaPrefix: "zb_"
EimSchemaPrefix: "eim_"

# ============================================================
# Transport encryption (must match RPC)
# Per docs/password-login-register.txt:
#   Web (plat=3): req=PHp1st5vEg5Ca8FH, resp=qlCJekfRKwWkQxl7
#   WAP (plat=4): req=PHp1st5vEg5Ca8FH, resp=PHp1st5vEg5Ca8FH (same as req)
# ============================================================
ApiKeyReq: "PHp1st5vEg5Ca8FH"
ApiKeyResp: "qlCJekfRKwWkQxl7"
ApiKeyRespWap: "PHp1st5vEg5Ca8FH"

# ============================================================
# App mode + SMS dev bypass
# ============================================================
SmsDevBypassCode: "8888"

# ============================================================
# Kaptcha (image captcha) — /api/kaptcha?t=<ts>&mobile=<phone>
# ============================================================
KaptchaCodeLen: 5
KaptchaTTL: 300

# ============================================================
# JSONP snapshot directory (served as static files)
# ============================================================
JsonpSnapshotDir: ./data/jsonp

# ============================================================
# File asset URL prefix
# ============================================================
FileBaseURL: "https://sta.ncctrials.com/file"

# ============================================================
# Rate limits
# ============================================================
RateLimitPerMinute: 120
RateLimitAuthPerMinute: 20

# ============================================================
# Chat
# ============================================================
ChatMaxMsgLen: 500
ChatHistoryLim: 50
ChatRatePerMin: 60

# ============================================================
# CORS
# ============================================================
CorsOrigin: "*"
